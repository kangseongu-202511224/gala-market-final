<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f7f9fc" />
  <title>GALA MARKET | 모의투자대회</title>
  <link rel="stylesheet" href="styles.css" />
  <script src="app.js" defer></script>
</head>
<body>
 <div class="shell">
   <header class="top"><div><small>경제인의 밤 · 모의투자대회</small><h1>GALA <span>MARKET</span></h1></div><span class="pill demo">● 시연 모드</span></header>
   <div class="roundBar"><div><b>ROUND <span id="round">2</span> / 4</b><span class="muted" id="roundTag">가상 미국 대선</span></div><span class="pill">거래 체험</span></div>
   <main id="view"></main>
   <nav class="bottom" aria-label="하단 메뉴"><button data-nav="home" class="active"><span>⌂</span>홈</button><button data-nav="market"><span>▥</span>주식</button><button data-nav="portfolio"><span>◔</span>내 투자</button><button data-nav="ranking"><span>♛</span>랭킹</button></nav>
 </div>
 <dialog id="tradeDialog"><form method="dialog" class="tradeForm"><button class="x" value="cancel" aria-label="닫기">×</button><div id="dialogTitle"></div><div class="switch"><button type="button" id="buyTab" class="selected">매수</button><button type="button" id="sellTab">매도</button></div><label for="quantity">수량 (1주 단위)</label><input id="quantity" type="number" min="1" step="1" value="1" inputmode="numeric"/><div class="line"><span>예상 주문금액</span><strong id="orderCost">-</strong></div><div class="muted tiny" id="balanceHelp"></div><button type="button" id="confirmTrade" class="primary wide">시연 주문 확정</button><p id="orderMessage" class="notice" role="status"></p></form></dialog>
</body>
</html>
